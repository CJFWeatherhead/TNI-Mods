Name: Cart Saver - Saved Shopping Lists
Description: |
  Stop re-typing the same shopping list every time you kit out a floor. Build a named list
  once, then order the whole thing with one button.

  ## Features
  - Build lists by browsing merchants and their live stock, right in the panel
  - Order a saved list in one click, through the merchant's real order path
  - Rename, delete and edit lists from an in-game panel
  - Edit quantities per line, or drop lines you do not want this time
  - Remembers cable colours, and can order **several colours of the same cable in one list**,
    which the shop does not normally allow
  - Per-list delivery floor
  - Out-of-stock lines are clamped to available stock or skipped, instead of losing the order

  ## How to use
  1. Click **Saved Carts** in the bottom-left corner (or type `carts` in the `~` console)
  2. Press **New list**, then **Add item**: pick a merchant, an item, a quantity and a colour
  3. Name the list and press **Save**
  4. Next time you build a floor, press **Order** on that list

  ## One thing to do each session
  The sandbox will not let a mod create an order line from nothing, so Cart Saver borrows one
  from the game. Put **any single item** in the D-Market2 cart, press **Learn** in the panel,
  and you are set for the rest of the session - you can clear the cart straight afterwards.

  ## Where lists are kept
  Mods are not allowed to write files, so lists are stored in the **in-game clipboard notepad**
  between `[cartsaver]` markers. Anything else you have written there is left alone. Press
  **Code** then **Copy** to put a backup string on your system clipboard, or to move lists to
  another save.

  ## Console commands
  - `carts` : open / close the panel
  - `cart_code` : print the backup code for all your lists
  - `cart_probe` : diagnostics - run this first if something misbehaves
  - `cart_scan` : dump the market UI nodes, to debug cart importing

