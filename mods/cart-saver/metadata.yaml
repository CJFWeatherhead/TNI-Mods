Notes: |
  Built around several hard limits of the Lua sandbox, all confirmed from game logs:

  - ModFileSystem refuses writes ("writing of files is not allowed"), hence notepad storage.
  - get_script() is a banned property and create_node() only reaches engine classes, so a
    DeviceCheckout cannot be constructed. One is borrowed from a live cart row and reused for
    every order line, which is what the Learn button does. Orders are therefore submitted one
    line at a time via DeviceMerchant.submit_order().
  - A Lua function handed to Godot as a Callable fires exactly once: gd_callable_lua() leaves
    it at index 1 of a coroutine stack, lua_pcall() pops it, and nothing pushes it back. The
    second call errors, the error is rethrown as a C++ exception, and unwinding it exhausts
    the sandbox budget - the game freezes with "Sandbox: Timeout". So there are no signal
    connections at all: buttons are toggle buttons polled from on_game_tick, and console
    commands re-register only the command that just ran (each registration pins a coroutine).
  - The Lua heap is about 1800 KB and "Out of memory" is fatal, so hot paths use shared
    helper functions with pcall(fn, args...) instead of allocating a closure per call.
  - Touching a freed object raises a C++ bad_cast that pcall cannot catch, so poll entries are
    removed before their nodes are freed and never probed afterwards.
  - find_children matches the engine class, not the script class, so cart rows are reached
    through the market app's chkoctl container, falling back to node-name patterns.
  - The cart's rows are plain HBoxContainers built in code (auto-named "@HBoxContainer@6806")
    with no script and no listing or checkout references. Their content is five child labels:
    Name, Variant, QtyContainer, UnitPrice, Subtotal. Rows are found structurally inside the
    CartItems container and read by parsing that text; the merchant is recovered by matching
    the title against every merchant's listings. The first child of CartItems is always
    CartItemPreview, which mirrors the store's current filtered selection and must be skipped.
    An empty cart reports empty rather than falling back to a global search.
  - The OS clipboard is reachable only through LineEdit.menu_option(MENU_COPY); DisplayServer
    needs Engine.get_singleton(), which is banned.
Parameters:
  - Name: show_toggle_button
    Label: Show On-Screen Button
    Type: boolean
    Default: true
    Description: Show the "Saved Carts" button in the bottom-left corner. Turn off to use only the ~ console commands.
  - Name: use_notepad_storage
    Label: Store Lists In The In-Game Notepad
    Type: boolean
    Default: true
    Description: Keep lists in the clipboard notepad so they survive restarts. Turn off to use only the copy-paste code.
  - Name: clamp_to_stock
    Label: Clamp Quantities To Stock
    Type: boolean
    Default: true
    Description: If a merchant has fewer in stock than the list asks for, order what is left instead of skipping the line
  - Name: set_subtotal
    Label: Write Line Subtotals
    Type: boolean
    Default: true
    Description: Set each order line's subtotal to listing price x quantity. Turn off if the game ever charges you the wrong amount.
  - Name: cable_colors
    Label: Cable Colour Choices
    Type: string
    Default: Original,Yellow,Blue,Purple,Orange,Green,Red,Grey
    Description: Comma-separated colours offered for cable lines
  - Name: poll_every_n_ticks
    Label: UI Poll Interval (ticks)
    Type: integer
    Default: 4
    Min: 1
    Max: 30
    Description: Game ticks between UI polls. Higher is cheaper but makes buttons feel less responsive.
  - Name: debug_logging
    Label: Enable Debug Logging
    Type: boolean
    Default: false
    Description: Show extra detail in the console about scanning, saving and ordering
