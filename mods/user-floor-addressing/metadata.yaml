Parameters:
  - Name: use_random_suffix
    Label: Use Randomised Suffix
    Type: boolean
    Default: false
    Description: "false = incremental counter per floor (usr1, usr2, ...); true = random 4-character lowercase suffix (usrabcd, usrxyze, ...)"
  - Name: address_format
    Label: Network Address Format
    Type: string
    Default: "@f%d/usr%s"
    Description: Format string for network addresses. %d is replaced with floor number, %s with the user suffix (e.g., "@f%d/usr%s" becomes "@f0/usr1" or "@f0/usrabcd")
  - Name: dns_format
    Label: Floor DNS Server Format
    Type: string
    Default: "@f%d/dns"
    Description: Format string for floor-specific DNS servers. %d is replaced with floor number (e.g., "@f%d/dns" becomes "@f0/dns")
  - Name: fallback_dns_1
    Label: Fallback DNS Server 1
    Type: string
    Default: "@srv/dns1"
    Description: First fallback DNS server if floor-specific DNS is unavailable
  - Name: fallback_dns_2
    Label: Fallback DNS Server 2
    Type: string
    Default: "@srv/dns2"
    Description: Second fallback DNS server